name: MOVETAIN WebSocket lifetime regression
on:
  push:
    paths:
      - 'src/platform/esp32/mvt_websocket_*'
      - 'tests/wss/websocket_poll_test.cpp'
      - 'tests/wss/websocket_receive_test.cpp'
      - 'src/modules/MvtOta*'
      - 'tests/wss/ota_marker_test.cpp'
      - 'tests/ota/**'
      - '.github/workflows/test_mvt_websocket.yml'
  pull_request:
    paths:
      - 'src/platform/esp32/mvt_websocket_*'
      - 'tests/wss/websocket_poll_test.cpp'
      - 'tests/wss/websocket_receive_test.cpp'
      - 'src/modules/MvtOta*'
      - 'tests/wss/ota_marker_test.cpp'
      - 'tests/ota/**'
      - '.github/workflows/test_mvt_websocket.yml'
permissions:
  contents: read
jobs:
  concurrent-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build production poll helper regression
        run: g++ -std=c++14 -pthread -Wall -Wextra tests/wss/websocket_poll_test.cpp -o /tmp/wss-poll-test
      - name: Exercise simultaneous read/send failure and graceful close
        run: timeout 15s /tmp/wss-poll-test
      - name: Verify incomplete frame cannot prevent stop and reconnect
        run: |
          g++ -std=c++14 -Wall -Wextra tests/wss/websocket_receive_test.cpp -o /tmp/wss-receive-test
          timeout 15s /tmp/wss-receive-test
      - name: Verify streaming image marker without heap allocations
        run: |
          g++ -std=c++14 -Wall -Wextra tests/wss/ota_marker_test.cpp -o /tmp/ota-marker-test
          /tmp/ota-marker-test
      - uses: actions/checkout@v4
        with:
          repository: DaveGamble/cJSON
          ref: v1.7.19
          path: .tools/cjson
      - name: Verify production OTA worker cancellation and resource cleanup
        run: |
          gcc -I.tools/cjson -c .tools/cjson/cJSON.c -o /tmp/mvt-cjson.o
          g++ -std=c++14 -Wall -Wextra -Itests/ota/stubs -I.tools/cjson -Isrc tests/ota/cancellation_test.cpp src/modules/MvtOtaUpdater.cpp /tmp/mvt-cjson.o -o /tmp/ota-cancellation-test
          timeout 15s /tmp/ota-cancellation-test
